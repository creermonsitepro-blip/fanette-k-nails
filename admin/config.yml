backend:
  name: github
  repo: creermonsitepro-blip/fanette-k-nails
  branch: main
  auth_type: github_app
  base_url: https://decapbridge.web.app
  auth_endpoint: /sites/6699f96a-f9ae-44a5-b1b9-7d57a65a08ce/pkce

media_folder: uploads
public_folder: /uploads

collections:
  - name: contenu
    label: Contenu du site
    files:
      - name: general
        label: Informations générales
        file: _data/content.json
        fields:
          - label: Nom du salon
            name: salon_name
            widget: string
          - label: Téléphone
            name: phone
            widget: string
          - label: Email
            name: email
            widget: string
          - label: Adresse
            name: address
            widget: string
          - label: Horaires
            name: hours
            widget: text
          - label: Services
            name: services
            widget: list
            fields:
              - label: Nom
                name: name
                widget: string
              - label: Prix
                name: price
                widget: number
              - label: Durée (min)
                name: duration
                widget: number
              - label: Description
                name: description
                widget: text
                required: false
