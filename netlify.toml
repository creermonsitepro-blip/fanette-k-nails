[build]
  command = "echo 'Static site, no build step needed'"
  publish = "."

[dev]
  command = "echo 'Dev mode'"
  port = 8000

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/dashboard*"
  to = "/dashboard.html"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  SUPABASE_URL = ""
  SUPABASE_KEY = ""
  SUPABASE_SERVICE_KEY = ""
  STRIPE_PUBLIC_KEY = ""
  STRIPE_SECRET_KEY = ""
  SENDGRID_API_KEY = ""
  FANETTE_EMAIL = "fk.nails26@gmail.com"
  SITE_URL = ""
  ADMIN_TOKEN = ""
  DECAPBRIDGE_URL = "https://decapbridge.web.app"
  DECAPBRIDGE_REPO = "creermonsitepro-blip/fanette-k-nails"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "max-age=31536000, immutable"
