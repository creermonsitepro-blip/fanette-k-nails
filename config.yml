backend:
  name: github
  repo: creermonsitepro-blip/fanette-k-nails
  branch: main
  auth_type: github_app
  app_id: YOUR_APP_ID
  base_url: https://decapbridge.web.app
  auth_endpoint: /sites/6699f96a-f9ae-44a5-b1b9-7d57a65a08ce/pkce

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: settings
    label: Paramètres
    files:
      - name: general
        label: Général
        file: _data/content.json
        fields:
          - { label: "Nom du salon", name: "salon_name", widget: "string" }
          - { label: "Téléphone", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Adresse", name: "address", widget: "string" }
          - { label: "Horaires", name: "hours", widget: "text" }

  - name: services
    label: Services
    file: _data/content.json
    fields:
      - label: Services
        name: services
        widget: list
        fields:
          - { label: "Nom", name: "name", widget: "string" }
          - { label: "Prix", name: "price", widget: "number" }
          - { label: "Durée (min)", name: "duration", widget: "number" }

  - name: reservations
    label: Réservations
    files:
      - name: reservations_list
        label: Liste des réservations
        file: _data/reservations.json
        fields:
          - { label: "ID", name: "id", widget: "string" }
          - { label: "Client", name: "client_name", widget: "string" }
          - { label: "Email", name: "client_email", widget: "string" }
          - { label: "Date", name: "reservation_date", widget: "datetime" }
          - { label: "Statut", name: "status", widget: "select", options: ["pending", "validated", "confirmed", "completed", "cancelled"] }
