collections:
  - name: content
    label: Contenu Principal
    file: _data/content.json
    format: json
    fields:
      - label: Entreprise
        name: business
        widget: object
        fields:
          - { label: Nom, name: name, widget: string }
          - { label: Téléphone, name: phone, widget: string }
          - { label: E-mail, name: email, widget: string }
          - { label: Adresse, name: address, widget: string }
          - { label: SIREN, name: siren, widget: string }
          - { label: Nom légal, name: legalName, widget: string }
          - { label: Activité, name: activity, widget: string }
          - { label: Instagram, name: instagram, widget: string }
          - { label: Facebook, name: facebook, widget: string }

      - label: Prestations
        name: services
        widget: list
        fields:
          - { label: ID, name: id, widget: string }
          - { label: Nom, name: name, widget: string }
          - { label: Prix (€), name: price, widget: number }
          - { label: Durée (min), name: duration, widget: number }
          - { label: Description, name: description, widget: string }

      - label: Horaires
        name: horaires
        widget: object
        fields:
          - label: Mardi
            name: mardi
            widget: object
            fields:
              - { label: Ouverture, name: start, widget: string, pattern: ['\\d{2}:\\d{2}', 'Format: HH:MM'] }
              - { label: Fermeture, name: end, widget: string, pattern: ['\\d{2}:\\d{2}', 'Format: HH:MM'] }
          - label: Mercredi
            name: mercredi
            widget: object
            fields:
              - { label: Ouverture, name: start, widget: string, pattern: ['\\d{2}:\\d{2}', 'Format: HH:MM'] }
              - { label: Fermeture, name: end, widget: string, pattern: ['\\d{2}:\\d{2}', 'Format: HH:MM'] }
          - label: Jeudi
            name: jeudi
            widget: object
            fields:
              - { label: Ouverture, name: start, widget: string, pattern: ['\\d{2}:\\d{2}', 'Format: HH:MM'] }
              - { label: Fermeture, name: end, widget: string, pattern: ['\\d{2}:\\d{2}', 'Format: HH:MM'] }
          - label: Vendredi
            name: vendredi
            widget: object
            fields:
              - { label: Ouverture, name: start, widget: string, pattern: ['\\d{2}:\\d{2}', 'Format: HH:MM'] }
              - { label: Fermeture, name: end, widget: string, pattern: ['\\d{2}:\\d{2}', 'Format: HH:MM'] }
          - label: Samedi
            name: samedi
            widget: object
            fields:
              - { label: Ouverture, name: start, widget: string, pattern: ['\\d{2}:\\d{2}', 'Format: HH:MM'] }
              - { label: Fermeture, name: end, widget: string, pattern: ['\\d{2}:\\d{2}', 'Format: HH:MM'] }

      - label: Acompte
        name: deposit
        widget: object
        fields:
          - { label: Montant (€), name: amount, widget: number }
          - { label: Devise, name: currency, widget: string }

      - label: Stripe
        name: stripe
        widget: object
        fields:
          - { label: Clé publique Stripe, name: publicKey, widget: string }
          - { label: Lien acompte Stripe, name: depositLink, widget: string }

      - label: Supabase
        name: supabase
        widget: object
        fields:
          - { label: URL Supabase, name: url, widget: string }
          - { label: Clé anon Supabase, name: anonKey, widget: string }

      - label: Politiques
        name: policies
        widget: object
        fields:
          - { label: Annulation +48h, name: cancellation48h, widget: string }
          - { label: Annulation -48h, name: cancellation48hMinus, widget: string }
          - { label: Limite no-show, name: noShowLimit, widget: string }

  - name: gallery
    label: Galerie
    folder: _data/gallery
    create: true
    format: json
    fields:
      - { label: Titre, name: title, widget: string }
      - { label: Photo, name: image, widget: image }
      - { label: Catégorie, name: category, widget: select, options: [gainage, rallongement, semi-permanent] }
      - { label: Alt (description), name: alt, widget: string }

  - name: slots
    label: Créneaux Disponibles
    folder: _data/slots
    create: true
    format: json
    fields:
      - { label: Date, name: date, widget: string, pattern: ['\\d{4}-\\d{2}-\\d{2}', 'Format: YYYY-MM-DD'] }
      - label: Créneaux
        name: times
        widget: list
        fields:
          - { label: Heure, name: time, widget: string, pattern: ['\\d{2}:\\d{2}', 'Format: HH:MM'] }
          - { label: Réservé ?, name: booked, widget: boolean }

backend:
  name: decapbridge
  repo: TON_USER_GITHUB/fanette-k-nails
  branch: main
  auth_endpoint: https://decapbridge-auth.example.com
  cms_label: Fanette Admin

media_folder: public/images
public_path: /images
